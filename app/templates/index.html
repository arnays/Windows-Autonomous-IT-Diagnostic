<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Windows Autonomous IT Diagnostic</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">DIAGNÓSTICO WINDOWS</p>
      <h1>Analiza tus registros EVTX</h1>
      <p class="intro">Carga un archivo para encontrar errores y advertencias. El análisis es de solo lectura; no aplica reparaciones.</p>
    </header>
    <form id="analysis-form">
      <label for="context">¿Qué problema observas en el equipo?</label>
      <textarea id="context" name="context" rows="3" placeholder="Describe cuándo comenzó y qué síntomas presenta"></textarea>
      <label class="upload" for="file"><span class="upload-icon">＋</span><span><strong>Seleccionar archivo EVTX</strong><small id="file-name">o arrástralo aquí</small></span></label>
      <input id="file" name="file" type="file" accept=".evtx,application/octet-stream" required>
      <label class="check"><input type="checkbox" name="use_ai" value="true"><span>Solicitar análisis adicional a Ollama local (si está configurado)</span></label>
      <button type="submit">Analizar registro</button>
    </form>
    <p id="status" class="status" role="status"></p>
    <section id="results" hidden></section>
    <footer>Versión inicial · Sin ejecución de comandos ni reparaciones automáticas</footer>
  </main>
  <script>
    const form = document.querySelector('#analysis-form');
    const file = document.querySelector('#file');
    const status = document.querySelector('#status');
    const results = document.querySelector('#results');
    file.addEventListener('change', () => document.querySelector('#file-name').textContent = file.files[0]?.name || 'o arrástralo aquí');
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); status.textContent = 'Analizando...'; results.hidden = true;
      const data = new FormData(form);
      try {
        const response = await fetch('/api/v1/analyses', { method: 'POST', body: data });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || 'No se pudo completar el análisis.');
        results.replaceChildren();
        const summary = document.createElement('h2'); summary.textContent = `Resultado: ${body.error_count} errores · ${body.warning_count} advertencias`;
        results.append(summary);
        const notice = document.createElement('p'); notice.textContent = body.notice; results.append(notice);
        for (const finding of body.findings) {
          const article = document.createElement('article'); article.className = `finding ${finding.severity}`;
          const title = document.createElement('h3'); title.textContent = `${finding.severity === 'error' ? 'Error' : 'Advertencia'} · ${finding.provider} · ID ${finding.event_id}`;
          const desc = document.createElement('p'); desc.textContent = `${finding.count} evento(s). ${finding.description}`;
          const source = document.createElement('small'); source.textContent = finding.source;
          article.append(title, desc, source); results.append(article);
        }
        if (body.ai_diagnosis) { const pre = document.createElement('pre'); pre.textContent = JSON.stringify(body.ai_diagnosis, null, 2); results.append(pre); }
        results.hidden = false; status.textContent = 'Análisis completado.';
      } catch (error) { status.textContent = error.message; }
    });
  </script>
</body>
</html>
